name: Publish verified ShieldProxy update

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes shown in ShieldProxy
        required: true
        type: string
      rollout_percent:
        description: Percentage of rollout-capable installations offered this update
        required: true
        default: 100
        type: number
      channel:
        description: Beta publishes a signed prerelease without notifying existing installations
        required: true
        default: stable
        type: choice
        options:
          - beta
          - stable

permissions:
  contents: write

concurrency:
  group: publish-shieldproxy-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHIELD_SUITE_STORE_PASSWORD: ${{ secrets.SHIELD_SUITE_STORE_PASSWORD }}
      SHIELD_SUITE_KEY_ALIAS: ${{ secrets.SHIELD_SUITE_KEY_ALIAS }}
      SHIELD_SUITE_KEY_PASSWORD: ${{ secrets.SHIELD_SUITE_KEY_PASSWORD }}

    steps:
      - name: Check out the exact source being released
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the permanent release key
        shell: bash
        env:
          SUITE_KEYSTORE_BASE64: ${{ secrets.SUITE_KEYSTORE_BASE64 }}
        run: |
          test -n "$SUITE_KEYSTORE_BASE64"
          printf '%s' "$SUITE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/suite-release.jks"
          chmod 600 "$RUNNER_TEMP/suite-release.jks"
          echo "SHIELD_SUITE_KEYSTORE=$RUNNER_TEMP/suite-release.jks" >> "$GITHUB_ENV"

      - name: Assign a monotonic build version
        shell: bash
        run: |
          VERSION_CODE=$(( $(date -u +%s) - 1577836800 ))
          test "$VERSION_CODE" -gt 20
          test "$VERSION_CODE" -le 2100000000
          echo "BUILD_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Test and build the signed release
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --max-workers=2

      - name: Verify and describe the release
        id: release
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'
          unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/'
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK" | head -1)"
          VERSION_CODE="$(printf '%s' "$BADGING" | sed -nE "s/.*versionCode='([0-9]+)'.*/\\1/p")"
          VERSION_NAME="$(printf '%s' "$BADGING" | sed -nE "s/.*versionName='([^']+)'.*/\\1/p")"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test "$VERSION_CODE" = "$BUILD_VERSION_CODE"
          SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          ASSET_NAME="ShieldProxy-${VERSION_NAME}.apk"
          TAG="shieldproxy-${VERSION_CODE}"
          cp "$APK" "$RUNNER_TEMP/$ASSET_NAME"
          echo "apk=$RUNNER_TEMP/$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish immutable APK in this GitHub repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          TAG: ${{ steps.release.outputs.tag }}
          APK: ${{ steps.release.outputs.apk }}
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.txt"
          EXTRA_ARGS=()
          if [ "$CHANNEL" = "beta" ]; then EXTRA_ARGS+=(--prerelease); fi
          gh release create "$TAG" "$APK#$ASSET_NAME" \
            --target "$GITHUB_SHA" \
            --title "ShieldProxy ${{ steps.release.outputs.version_name }}" \
            --notes-file "$RUNNER_TEMP/release-notes.txt" \
            "${EXTRA_ARGS[@]}"

      - name: Create checksum-pinned update metadata
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
          SHA256: ${{ steps.release.outputs.sha256 }}
          ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          python3 - <<'PY'
          import json, os
          rollout = 0 if os.environ["CHANNEL"] == "beta" else int(os.environ["ROLLOUT_PERCENT"])
          if not 0 <= rollout <= 100:
              raise SystemExit("rollout_percent must be between 0 and 100")
          apk = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/latest/ShieldProxy.apk"
          immutable_apk = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
              f"{os.environ['TAG']}/{os.environ['ASSET_NAME']}"
          )
          metadata = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apk": apk,
              "packageName": "com.privacyshield.proxy",
              "apkUrl": immutable_apk,
              "sha256": os.environ["SHA256"],
              "notes": os.environ["NOTES"],
              "rolloutPercent": rollout,
          }
          with open("version.json", "w", encoding="utf-8") as output:
              json.dump(metadata, output, ensure_ascii=False, separators=(",", ":"))
          PY

      - name: Attach immutable update metadata to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload "$TAG" "version.json" --clobber

      - name: Publish the stable latest-tag URLs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.release.outputs.apk }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          NOTES: ${{ inputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/latest-notes.txt"
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --target "$GITHUB_SHA" \
              --title "ShieldProxy latest ($VERSION_NAME)" \
              --notes-file "$RUNNER_TEMP/latest-notes.txt"
          else
            gh release edit latest \
              --title "ShieldProxy latest ($VERSION_NAME)" \
              --notes-file "$RUNNER_TEMP/latest-notes.txt"
          fi
          gh release upload latest "$APK#ShieldProxy.apk" --clobber
          gh release upload latest version.json --clobber

      - name: Publish metadata only after the APK passed every check
        if: inputs.channel == 'stable'
        shell: bash
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$SUPABASE_SECRET_KEY"
          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary @version.json \
            "https://oqyrbdvehvqdcpglaojo.supabase.co/storage/v1/object/app-releases/shieldproxy/latest.json"
