name: Publish verified ShieldProxy update

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes shown in ShieldProxy
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-shieldproxy-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHIELD_SUITE_STORE_PASSWORD: ${{ secrets.SHIELD_SUITE_STORE_PASSWORD }}
      SHIELD_SUITE_KEY_ALIAS: ${{ secrets.SHIELD_SUITE_KEY_ALIAS }}
      SHIELD_SUITE_KEY_PASSWORD: ${{ secrets.SHIELD_SUITE_KEY_PASSWORD }}

    steps:
      - name: Check out the exact source being released
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the permanent release key
        shell: bash
        env:
          SUITE_KEYSTORE_BASE64: ${{ secrets.SUITE_KEYSTORE_BASE64 }}
        run: |
          test -n "$SUITE_KEYSTORE_BASE64"
          printf '%s' "$SUITE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/suite-release.jks"
          chmod 600 "$RUNNER_TEMP/suite-release.jks"
          echo "SHIELD_SUITE_KEYSTORE=$RUNNER_TEMP/suite-release.jks" >> "$GITHUB_ENV"

      - name: Test and build the signed release
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --max-workers=2

      - name: Verify and describe the release
        id: release
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          ASSET_NAME="ShieldProxy-${VERSION_NAME}.apk"
          TAG="shieldproxy-${VERSION_CODE}"
          cp "$APK" "$RUNNER_TEMP/$ASSET_NAME"
          echo "apk=$RUNNER_TEMP/$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish immutable APK in this GitHub repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          TAG: ${{ steps.release.outputs.tag }}
          APK: ${{ steps.release.outputs.apk }}
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.txt"
          gh release create "$TAG" "$APK#$ASSET_NAME" \
            --target "$GITHUB_SHA" \
            --title "ShieldProxy ${{ steps.release.outputs.version_name }}" \
            --notes-file "$RUNNER_TEMP/release-notes.txt"

      - name: Create checksum-pinned update metadata
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          python3 - <<'PY'
          import json, os
          metadata = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "packageName": "com.privacyshield.proxy",
              "apkUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}/{os.environ['ASSET_NAME']}",
              "sha256": os.environ["SHA256"],
              "notes": os.environ["NOTES"],
          }
          with open("latest.json", "w", encoding="utf-8") as output:
              json.dump(metadata, output, ensure_ascii=False, separators=(",", ":"))
          PY

      - name: Publish metadata only after the APK passed every check
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary @latest.json \
            "https://oqyrbdvehvqdcpglaojo.supabase.co/storage/v1/object/app-releases/shieldproxy/latest.json"
