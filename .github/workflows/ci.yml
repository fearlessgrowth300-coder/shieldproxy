name: ShieldProxy CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHIELD_SUITE_STORE_PASSWORD: ${{ secrets.SHIELD_SUITE_STORE_PASSWORD }}
      SHIELD_SUITE_KEY_ALIAS: ${{ secrets.SHIELD_SUITE_KEY_ALIAS }}
      SHIELD_SUITE_KEY_PASSWORD: ${{ secrets.SHIELD_SUITE_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the permanent suite signing key
        shell: bash
        env:
          SUITE_KEYSTORE_BASE64: ${{ secrets.SUITE_KEYSTORE_BASE64 }}
        run: |
          test -n "$SUITE_KEYSTORE_BASE64"
          printf '%s' "$SUITE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/suite-release.jks"
          chmod 600 "$RUNNER_TEMP/suite-release.jks"
          echo "SHIELD_SUITE_KEYSTORE=$RUNNER_TEMP/suite-release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests and build the debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --max-workers=2
