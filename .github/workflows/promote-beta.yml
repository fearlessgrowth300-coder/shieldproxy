name: Promote ShieldProxy beta to stable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact prerelease tag to promote
        required: true
        type: string
      expected_version_code:
        description: Exact version code expected in attached metadata
        required: true
        type: number
      rollout_percent:
        description: Initial rollout percentage (use 100 for the 9.0 baseline)
        required: true
        default: 100
        type: number

permissions:
  contents: write

concurrency:
  group: promote-shieldproxy-beta
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify beta metadata and APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code }}
          ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' | grep -qx true
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern version.json
          APK_URL="$(python3 - <<'PY'
          import json, os
          data = json.load(open("version.json"))
          rollout = int(os.environ["ROLLOUT_PERCENT"])
          assert 0 <= rollout <= 100
          assert data["versionCode"] == int(os.environ["EXPECTED_VERSION_CODE"])
          assert data["packageName"] == "com.privacyshield.proxy"
          expected = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/latest/ShieldProxy.apk"
          assert data["apk"] == expected
          assert len(data["sha256"]) == 64
          data["rolloutPercent"] = rollout
          json.dump(data, open("stable.json", "w"), ensure_ascii=False, separators=(",", ":"))
          immutable = data.get("apkUrl", "")
          expected_prefix = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
              f"{os.environ['TAG']}/"
          )
          assert immutable.startswith(expected_prefix)
          print(immutable)
          PY
          )"
          curl --fail-with-body --silent --show-error --retry 3 --location "$APK_URL" -o candidate.apk
          EXPECTED_SHA="$(python3 -c 'import json; print(json.load(open("stable.json"))["sha256"])')"
          echo "$EXPECTED_SHA  candidate.apk" | sha256sum --check

      - name: Publish verified metadata and mark release stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$SUPABASE_SECRET_KEY"
          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary @stable.json \
            "https://oqyrbdvehvqdcpglaojo.supabase.co/storage/v1/object/app-releases/shieldproxy/latest.json"
          cp candidate.apk ShieldProxy.apk
          gh release upload latest ShieldProxy.apk --clobber --repo "$GITHUB_REPOSITORY"
          # "file#text" sets an asset's display LABEL; the asset is still named after the file.
          # Uploading stable.json#version.json therefore published a stray stable.json asset and
          # left version.json pointing at the previous release, so clients saw the new APK behind
          # the old checksum and could not update at all. Copy to the real name instead.
          cp stable.json version.json
          gh release upload latest version.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest

      - name: Verify the published update chain end to end
        shell: bash
        env:
          EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code }}
          EXPECTED_ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
          SUPABASE_METADATA: https://oqyrbdvehvqdcpglaojo.supabase.co/storage/v1/object/public/app-releases/shieldproxy/latest.json
        run: |
          # A promotion is only real when what clients READ matches what they DOWNLOAD. Those two
          # halves have drifted apart twice in the sibling repository: once when an asset upload
          # failed after the Supabase POST had already succeeded, and once when "file#name" uploaded
          # metadata under the wrong asset name. Both left every install offered an update whose
          # checksum could never match, and both looked like a green run. Re-read the published
          # files exactly as a client does and fail loudly rather than ship a dead update.
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/latest/version.json?check=$GITHUB_RUN_ID" \
            -o published.json
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors \
            "$SUPABASE_METADATA" -o supabase.json
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          expected = int(os.environ["EXPECTED_VERSION_CODE"])
          expected_rollout = int(os.environ["EXPECTED_ROLLOUT_PERCENT"])
          published = json.load(open("published.json"))
          supabase = json.load(open("supabase.json"))
          failures = []
          for source, meta in (("github", published), ("supabase", supabase)):
              if meta.get("versionCode") != expected:
                  failures.append(
                      f"{source} metadata advertises versionCode {meta.get('versionCode')}, expected {expected}")
              # A chain can be flawlessly checksummed and still reach NOBODY. Updater.check()
              # treats rolloutPercent <= 0 as "no update available", and publish-update.yml
              # forces 0 for beta channel builds, so a promotion that fails to lift the staged
              # percentage is invisible to every install instead of merely wrong. Absent field
              # means 100 here because that is exactly how the client reads it.
              actual_rollout = meta.get("rolloutPercent", 100)
              if actual_rollout != expected_rollout:
                  failures.append(
                      f"{source} metadata advertises rolloutPercent {actual_rollout}, expected {expected_rollout}")
          apk_url = published.get("apk", "")
          digest = ""
          if not apk_url.startswith("https://"):
              failures.append(f"metadata apk url is not https: {apk_url!r}")
          else:
              with urllib.request.urlopen(apk_url) as response:
                  digest = hashlib.sha256(response.read()).hexdigest()
              if digest != published.get("sha256"):
                  failures.append(
                      f"{apk_url} hashes {digest} but metadata claims {published.get('sha256')}")
          if failures:
              raise SystemExit("published update chain is inconsistent:\n  " + "\n  ".join(failures))
          print(
              f"update chain verified: versionCode {expected}, "
              f"rolloutPercent {expected_rollout}, sha256 {digest}")
          if expected_rollout == 0:
              print("NOTE: rolloutPercent is 0 - this update is offered to NOBODY by design.")
          PY
