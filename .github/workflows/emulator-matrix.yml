name: Emulator API matrix

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 28, 29, 30, 31, 33, 34, 35, 36]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs without the suite key
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :probe:assembleDebug -PciDebugSigning=true --no-daemon --max-workers=2

      # ubuntu-latest exposes /dev/kvm, but the node is root:kvm 0660 until this
      # rule runs. android-emulator-runner then reports hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD snapshot cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-x86_64-google_apis-v2-${{ matrix.api-level }}

      - name: Boot the emulator and run the smoke test
        run: bash tools/emulator-boot.sh ${{ matrix.api-level }}

      - name: Collect logcat and tombstones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-api-${{ matrix.api-level }}
          path: emulator-artifacts/
          if-no-files-found: ignore
