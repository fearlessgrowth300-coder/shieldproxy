name: Emulator API matrix

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 28, 29, 30, 31, 33, 34, 35, 36]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs without the suite key
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :probe:assembleDebug -PciDebugSigning=true --no-daemon --max-workers=2

      # ubuntu-latest exposes /dev/kvm, but the node is root:kvm 0660 until this
      # rule runs. android-emulator-runner then reports hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD snapshot cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-x86_64-google_apis-${{ matrix.api-level }}

      - name: Create AVD snapshot for API ${{ matrix.api-level }}
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          cores: 4
          force-avd-creation: false
          disable-animations: false
          ram-size: 2048
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."

      - name: Run the smoke test on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          cores: 4
          force-avd-creation: false
          # Skipping the post-boot animation settings avoids an adb broken-pipe
          # that killed otherwise-booted API 30 and 36 emulators.
          disable-animations: false
          ram-size: 2048
          emulator-boot-timeout: 900
          # -no-snapshot-save keeps the cached snapshot from being rewritten.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: tools/emulator-api-smoke.sh

      - name: Collect logcat and tombstones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-api-${{ matrix.api-level }}
          path: emulator-artifacts/
          if-no-files-found: ignore
